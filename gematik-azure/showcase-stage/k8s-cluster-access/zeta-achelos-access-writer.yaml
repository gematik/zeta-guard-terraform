apiVersion: v1
kind: Namespace
metadata:
  name: zeta-achelos

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: deployer
  namespace: zeta-achelos
imagePullSecrets:
  - name: gitlab-registry-credentials-zeta-group
automountServiceAccountToken: false  # Pod-Token nicht automatisch mounten

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deployer-write
  namespace: zeta-achelos
rules:
  - apiGroups: [ "", "apps", "networking.k8s.io" ]
    resources:
      - pods
      - services
      - endpoints
      - deployments
      - statefulsets
      - replicasets
      - ingresses
      - configmaps
      - secrets
      - persistentvolumeclaims
      - persistentvolumeclaims/status
      - networkpolicies
    verbs: [ "get","list","watch","create","update","patch","delete" ]

  # EndpointSlices (modern endpoint API)
  - apiGroups: [ "discovery.k8s.io" ]
    resources: [ "endpointslices" ]
    verbs: [ "get","list","watch","create","update","patch","delete" ]

  - apiGroups: [ "policy" ]
    resources: [ "poddisruptionbudgets" ]
    verbs: [ "get","list","watch","create","update","patch","delete" ]

  # Zalando Postgres operator CRs
  - apiGroups: [ "acid.zalan.do" ]
    resources: [ "postgresqls" ]
    verbs: [ "get", "list", "watch", "create", "update", "patch", "delete" ]

  # Namespaced RBAC authored by charts (e.g., ingress-nginx)
  - apiGroups: [ "rbac.authorization.k8s.io" ]
    resources: [ "roles", "rolebindings" ]
    verbs: [ "get", "list", "watch", "create", "update", "patch", "delete", "escalate", "bind" ]

  # Admission jobs or other chart jobs/cronjobs
  - apiGroups: [ "batch" ]
    resources: [ "jobs", "cronjobs" ]
    verbs: [ "get", "list", "watch", "create", "update", "patch", "delete" ]

  - apiGroups: [ "" ]
    resources: [ "serviceaccounts" ]
    verbs: [ "get", "list", "watch", "create", "update", "patch", "delete" ]

  - apiGroups: [ "storage.k8s.io" ]
    resources: [ "storageclasses" ]
    verbs: [ "get","list","watch" ]

  # allow reading pod logs
  - apiGroups: [ "" ]
    resources: [ "pods/log" ]
    verbs: [ "get","watch" ]

  # allow exec in logs
  - apiGroups: [ "" ]
    resources: [ "pods/exec"]
    verbs: [ "create", "get" ]

  # allow port-forward to pods and services
  - apiGroups: [ "" ]
    resources: [ "pods/portforward", "services/portforward" ]
    verbs: [ "create" ]

  # allow reading rollout/status for deployments/rs
  - apiGroups: [ "apps" ]
    resources: [ "deployments/status", "replicasets/status", "statefulsets/status" ]
    verbs: [ "get", "watch" ]

  # allow seeing events (for troubleshooting)
  - apiGroups: [ "" ]
    resources: [ "events" ]
    verbs: [ "get", "list","watch" ]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: deployer-binding
  namespace: zeta-achelos
subjects:
  - kind: ServiceAccount
    name: deployer
    namespace: zeta-achelos
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: deployer-write

