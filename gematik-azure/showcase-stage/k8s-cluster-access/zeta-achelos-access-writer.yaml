---
# Cluster-scoped RBAC for Helm to manage cluster resources (e.g., ingress-nginx)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: zeta-achelos-deployer-clusterscope
rules:
  # For terraform-lock file
  - apiGroups: [ "coordination.k8s.io" ]
    resources: [ "leases" ]
    verbs: [ "get", "create", "update", "patch" ]
    
  # Cluster-scoped RBAC authored by some charts (e.g., ingress-nginx)
  - apiGroups: [ "rbac.authorization.k8s.io" ]
    resources: [ "clusterroles", "clusterrolebindings" ]
    verbs: [ "get", "list", "watch", "create", "update", "patch", "delete", "escalate", "bind" ]

  # Admission webhooks used by ingress-nginx and others
  - apiGroups: [ "admissionregistration.k8s.io" ]
    resources: [ "validatingwebhookconfigurations", "mutatingwebhookconfigurations" ]
    verbs: [ "get", "list", "watch", "create", "update", "patch", "delete" ]

  # IngressClass managed by ingress controllers
  - apiGroups: [ "networking.k8s.io" ]
    resources: [ "ingressclasses" ]
    verbs: [ "get", "list", "watch", "create", "update", "patch", "delete" ]

  # CRDs that may be installed by some charts
  - apiGroups: [ "apiextensions.k8s.io" ]
    resources: [ "customresourcedefinitions" ]
    verbs: [ "get", "list", "watch", "create", "update", "patch", "delete" ]

  # Namespaces (optional; handy with --create-namespace or for cleanup)
  - apiGroups: [ "" ]
    resources: [ "namespaces" ]
    verbs: [ "get", "list", "watch", "create", "update", "patch", "delete" ]

  # Cert-Manager cluster issuer (if used by umbrella chart)
  - apiGroups: [ "cert-manager.io" ]
    resources: [ "clusterissuers" ]
    verbs: [ "get", "list", "watch", "create", "update", "patch", "delete" ]

  # allow port-forward to pods and services in all namespaces
  - apiGroups: [ "" ]
    resources: [ "pods/portforward", "services/portforward" ]
    verbs: [ "create" ]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: zeta-achelos-deployer-clusterscope
subjects:
  - kind: ServiceAccount
    name: deployer
    namespace: zeta-achelos
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: zeta-achelos-deployer-clusterscope

---
