image: hashicorp/terraform:1.12.2

variables:
  TF_ROOT: gematik-azure/showcase-stage

cache:
  key: terraform-${CI_COMMIT_REF_SLUG}
  paths:
    - $TF_ROOT/.terraform
    - $TF_ROOT/.terraform.lock.hcl

stages:
  - init-validate-plan

terraform:
  stage: init-validate-plan
  tags: [aks]
  script:
    - cd "$TF_ROOT"
    - |
      if [ -z "$KUBECONFIG_B64" ]; then
        echo "KUBECONFIG_B64 is required but not set." >&2
        exit 1
      fi
      echo "$KUBECONFIG_B64" | base64 -d > kubeconfig
      export KUBECONFIG=$PWD/kubeconfig
      # Also pass kubeconfig path to Terraform variable so providers use it explicitly
      export TF_VAR_kubeconfig_path="$KUBECONFIG"
    - terraform init -backend-config=backend.hcl
    - terraform validate
    - terraform plan -var-file=../var-envs/common.tfvars -var="subscription_id=$ARM_SUBSCRIPTION_ID" -out plan.out
    - terraform show plan.out -no-color > output.txt
  artifacts:
    paths:
      - "$TF_ROOT/output.txt"
    expire_in: 1h
